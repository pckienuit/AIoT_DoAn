<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt vé — AIoT Flight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body>
  <div id="app">
    <div id="nav-placeholder"></div>

    <main class="page">
      <div class="shell">
        <div class="page__header">
          <div class="eyebrow">Bước 2 / 4</div>
          <h1>Thông tin hành khách</h1>
          <p class="text-muted">Nhập thông tin cho từng hành khách. Có thể đặt cho tối đa 9 người.</p>
        </div>

        <div class="page__grid page__grid--sidebar">
          <!-- Flight summary -->
          <div class="panel" id="flightSummaryPanel">
            <div class="panel__body">
              <h3 style="margin-bottom:var(--sp-4);">Chuyến bay đã chọn</h3>
              <div id="flightSummary"></div>
            </div>
          </div>

          <!-- Passenger form -->
          <div class="panel">
            <div class="panel__header">
              <span class="step-badge">A</span>
              <div>
                <h2>Thông tin hành khách</h2>
                <p>Nhập đầy đủ thông tin để đặt vé.</p>
              </div>
            </div>

            <div class="panel__body">
              <form id="bookingForm" novalidate>
                <div class="field-grid field-grid--3">
                  <div class="field" style="grid-column:1/-1;">
                    <label class="label" for="passengerName">Họ tên <span style="color:var(--danger)">*</span></label>
                    <input id="passengerName" name="name" type="text" class="input"
                      placeholder="VD: Nguyễn Văn A" required />
                  </div>
                  <div class="field">
                    <label class="label" for="passengerEmail">Email</label>
                    <input id="passengerEmail" name="email" type="email" class="input"
                      placeholder="email@example.com" />
                  </div>
                  <div class="field">
                    <label class="label" for="passengerPhone">Số điện thoại</label>
                    <input id="passengerPhone" name="phone" type="tel" class="input"
                      placeholder="0901234567" />
                  </div>
                </div>

                <hr class="divider" />

                <!-- Seat selection prompt -->
                <div class="alert alert--info" style="margin-bottom:var(--sp-5);">
                  <span>💺 <strong>Chọn ghế:</strong> Sau khi xác nhận đặt vé, bạn sẽ được chọn ghế trên sơ đồ tương tác.</span>
                </div>

                <!-- Price summary -->
                <div id="priceSummary" style="margin-bottom:var(--sp-5);"></div>

                <div class="actions">
                  <button type="submit" class="btn btn--primary btn--lg" id="confirmBtn">
                    Xác nhận đặt vé
                  </button>
                  <a href="/" class="btn btn--ghost">Quay lại</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="shell footer__inner">
        <span>© 2026 AIoT Flight</span>
      </div>
    </footer>
  </div>

  <script type="module">
    import { render } from "../js/components/nav.js";
    import { apiGetFlight } from "../js/api.js";
    import { navigate } from "../js/router.js";
    import { registerRoutes } from "../js/routes.js";
    import { getBookingFlow, saveBookingFlow, clearStaleFlow } from "../js/storage.js";
    import { isLoggedIn } from "../js/auth.js";
    import { formatVND } from "../js/components/flight-card.js";

    registerRoutes();
    clearStaleFlow();
    render();

    const flow = getBookingFlow();
    const flightId = new URLSearchParams(location.search).get("flight") || flow.flight?.id;
    const passengers = flow.passengers || 1;

    if (!flightId) { navigate("/"); }

    let flight = flow.flight || null;

    async function loadFlight() {
      if (!flight) {
        try { flight = await apiGetFlight(flightId); } catch { navigate("/"); }
      }
      renderFlight();
    }

    function renderFlight() {
      const f = flight;
      document.getElementById("flightSummary").innerHTML = `
        <div style="display:grid;gap:var(--sp-3);">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="mono font-bold text-xl">${f.origin_code || "—"} → ${f.dest_code || "—"}</span>
            <span class="badge badge--signal">${f.flight_number || "—"}</span>
          </div>
          <div class="text-muted text-sm">
            ${f.origin_city || ""} → ${f.dest_city || ""}
          </div>
          <hr style="border-color:var(--border);" />
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);">
            <div>
              <div class="text-xs text-muted">Khởi hành</div>
              <div class="mono font-bold">${String(f.departure_time||"").substring(0,5)}</div>
            </div>
            <div>
              <div class="text-xs text-muted">Đến nơi</div>
              <div class="mono font-bold">${String(f.arrival_time||"").substring(0,5)}</div>
            </div>
            <div>
              <div class="text-xs text-muted">Ngày</div>
              <div class="mono">${f.flight_date || "—"}</div>
            </div>
            <div>
              <div class="text-xs text-muted">Máy bay</div>
              <div class="mono">${f.plane_type || "—"}</div>
            </div>
          </div>
          <hr style="border-color:var(--border);" />
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="text-sm text-muted">${passengers} × giá vé</span>
            <span class="mono font-bold text-signal" style="font-size:1.2rem;">${formatVND(f.base_price || 0)}</span>
          </div>
        </div>`;

      const total = (f.base_price || 0) * passengers;
      document.getElementById("priceSummary").innerHTML = `
        <div style="display:grid;gap:var(--sp-2);padding:var(--sp-4);border:1px solid var(--border);background:var(--panel-strong);">
          <div style="display:flex;justify-content:space-between;" class="text-sm">
            <span class="text-muted">Giá vé (${passengers} khách)</span>
            <span class="mono">${formatVND(f.base_price * passengers)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;border-top:1px solid var(--border);padding-top:var(--sp-3);margin-top:var(--sp-2);">
            <span>Tổng cộng</span>
            <span class="mono text-signal">${formatVND(total)}</span>
          </div>
        </div>`;
    }

    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name  = document.getElementById("passengerName").value.trim();
      const email = document.getElementById("passengerEmail").value.trim();
      const phone = document.getElementById("passengerPhone").value.trim();

      if (!name) {
        document.getElementById("passengerName").focus();
        return;
      }

      const btn = document.getElementById("confirmBtn");
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Đang xử lý…`;

      try {
        saveBookingFlow({
          flight,
          passengers,
          passengerName: name,
          passengerEmail: email,
          passengerPhone: phone,
          totalPrice: (flight.base_price || 0) * passengers,
        });
        navigate(`/seat-map?flight=${flightId}`);
      } catch (err) {
        alert("Có lỗi: " + err.message);
        btn.disabled = false;
        btn.textContent = "Xác nhận đặt vé";
      }
    });

    loadFlight();
  </script>
</body>
</html>
